# ---------------------------------------------------------------
# Trimodal V30: Count-Focused Model
#
# The biggest accuracy gap is count (22% actual vs 47% oracle).
# This model is specifically tuned to maximize count accuracy:
#   1. COUNT_LOSS_WEIGHT: 3.0 (6x default!) — forces model to prioritize counting
#   2. FOCAL_GAMMA: 3.0 — harder focus on difficult count examples
#   3. V3 YOLOWorld features — better object detection = better counting
#   4. BERT-base with 4 layers
#   5. LABEL_SMOOTHING: 0.0 — sharper predictions for count numbers
#   6. Qtype weights boosted for count: count=5.0
#
# Even if overall accuracy drops to ~56%, this model should get
# count questions right that other models miss — invaluable for
# ensemble diversity on the biggest gap.
# ---------------------------------------------------------------

MODEL_USE: mcan
VISUAL_FEATURE: trimodal_fusion

OBJ_FEAT_SIZE: [80, 75]
BBOX_FEAT_SIZE: [100, 59]
LIDAR_FEAT_SIZE: [80, 6]
CAMERA_BEV_DIM: 69

LAYER: 6
HIDDEN_SIZE: 512
BBOXFEAT_EMB_SIZE: 512
FF_SIZE: 2048
MULTI_HEAD: 8
DROPOUT_R: 0.1
FLAT_MLP_SIZE: 512
FLAT_GLIMPSES: 1
FLAT_OUT_SIZE: 1024
USE_BBOX_FEAT: False
BBOX_NORMALIZE: False
WORD_EMBED_SIZE: 300

USE_BERT: True
USE_DISTILBERT: False
BERT_FINETUNE_LAYERS: 4

USE_MAP_FEATURES: True
MAP_DIM: 11
ENRICH_FEATURES: False
USE_RADARXF_V3: True
USE_MULTI_HEAD: True

BATCH_SIZE: 32
LR_BASE: 0.00003
LR_DECAY_R: 0.2
LR_DECAY_LIST: [10, 12]
WARMUP_EPOCH: 3
MAX_EPOCH: 16
GRAD_NORM_CLIP: 1.0
GRAD_ACCU_STEPS: 4
LOSS_FUNC: ce
LOSS_REDUCTION: sum
OPT: Adam
OPT_PARAMS: {betas: '(0.9, 0.98)', eps: '1e-9', weight_decay: '0.0001'}

# ★ Count-focused hyperparameters
COUNT_LOSS_WEIGHT: 3.0
LABEL_SMOOTHING: 0.0
FOCAL_GAMMA: 3.0
# qtype weights order: [exist, count, object, status, comparison]
MH_QTYPE_WEIGHTS: [1.0, 5.0, 2.0, 2.0, 1.0]

CROSS_MODAL_LAYERS: 2
USE_YOLO_DETECTION: False
FUSE_RADAR_DATA: False
USE_QTYPE_WEIGHTS: True
USE_CLIP_FEATURES: True
USE_SPATIAL_PE: False
REFINEMENT_ITERATIONS: 0
