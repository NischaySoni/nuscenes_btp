# ---------------------------------------------------------------
# Trimodal V31: Shallow & Wide — Different Architecture
#
# Diversity sources (4 independent axes of variation):
#   1. LAYER: 4 (shallow MCAN — 4 layers vs standard 6)
#   2. FF_SIZE: 4096 (wider FFN — 4096 vs standard 2048)
#   3. FLAT_OUT_SIZE: 2048 (wider projection — 2048 vs standard 1024)
#   4. BERT 2 layers (minimal fine-tuning — different from 4/6 layer)
#   5. V3 YOLOWorld features
#   6. Different seed (3333)
#
# Shallow+wide architectures learn different representations than
# deep+narrow ones. This should get genuinely different samples
# right in the ensemble.
# ---------------------------------------------------------------

MODEL_USE: mcan
VISUAL_FEATURE: trimodal_fusion

OBJ_FEAT_SIZE: [80, 75]
BBOX_FEAT_SIZE: [100, 59]
LIDAR_FEAT_SIZE: [80, 6]
CAMERA_BEV_DIM: 69

# ★ Shallow & wide MCAN
LAYER: 4
HIDDEN_SIZE: 512
BBOXFEAT_EMB_SIZE: 512
FF_SIZE: 4096
MULTI_HEAD: 8
DROPOUT_R: 0.1

# ★ Wider projection
FLAT_MLP_SIZE: 512
FLAT_GLIMPSES: 1
FLAT_OUT_SIZE: 2048

USE_BBOX_FEAT: False
BBOX_NORMALIZE: False
WORD_EMBED_SIZE: 300

# ★ Minimal BERT fine-tuning (only 2 layers)
USE_BERT: True
USE_DISTILBERT: False
BERT_FINETUNE_LAYERS: 2

USE_MAP_FEATURES: True
MAP_DIM: 11
ENRICH_FEATURES: False
USE_RADARXF_V3: True
USE_MULTI_HEAD: True

BATCH_SIZE: 32
LR_BASE: 0.00004
LR_DECAY_R: 0.2
LR_DECAY_LIST: [10, 12]
WARMUP_EPOCH: 3
MAX_EPOCH: 16
GRAD_NORM_CLIP: 1.0
GRAD_ACCU_STEPS: 4
LOSS_FUNC: ce
LOSS_REDUCTION: sum
OPT: Adam
OPT_PARAMS: {betas: '(0.9, 0.98)', eps: '1e-9', weight_decay: '0.0001'}

COUNT_LOSS_WEIGHT: 0.5
LABEL_SMOOTHING: 0.1
CROSS_MODAL_LAYERS: 2
USE_YOLO_DETECTION: False
FUSE_RADAR_DATA: False
USE_QTYPE_WEIGHTS: True
USE_CLIP_FEATURES: True
USE_SPATIAL_PE: False
REFINEMENT_ITERATIONS: 0
