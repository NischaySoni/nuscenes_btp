# ---------------------------------------------------------------
# Trimodal V28: BERT-base + V3 Features + High Dropout + No Smoothing
# 
# Diversity sources:
#   1. DROPOUT_R: 0.2 (double the standard 0.1)
#   2. No label smoothing (LABEL_SMOOTHING: 0.0)
#   3. Stronger weight decay (0.001 vs 0.0001)
#   4. 8-layer MCAN (deeper than 6-layer standard)
#
# Higher regularization = underfits slightly but makes very different
# errors. Excellent for ensemble diversity.
# ---------------------------------------------------------------

MODEL_USE: mcan
VISUAL_FEATURE: trimodal_fusion

OBJ_FEAT_SIZE: [80, 75]
BBOX_FEAT_SIZE: [100, 59]
LIDAR_FEAT_SIZE: [80, 6]
CAMERA_BEV_DIM: 69

# ★ 8-layer MCAN (deeper attention)
LAYER: 8
HIDDEN_SIZE: 512
BBOXFEAT_EMB_SIZE: 512
FF_SIZE: 2048
MULTI_HEAD: 8

# ★ High dropout for regularization diversity
DROPOUT_R: 0.2

FLAT_MLP_SIZE: 512
FLAT_GLIMPSES: 1
FLAT_OUT_SIZE: 1024
USE_BBOX_FEAT: False
BBOX_NORMALIZE: False
WORD_EMBED_SIZE: 300

USE_BERT: True
USE_DISTILBERT: False
BERT_FINETUNE_LAYERS: 4

USE_MAP_FEATURES: True
MAP_DIM: 11
ENRICH_FEATURES: False
USE_RADARXF_V3: True
USE_MULTI_HEAD: True

BATCH_SIZE: 32
LR_BASE: 0.00002
LR_DECAY_R: 0.2
LR_DECAY_LIST: [10, 12]
WARMUP_EPOCH: 3
MAX_EPOCH: 16
GRAD_NORM_CLIP: 1.0
GRAD_ACCU_STEPS: 4
LOSS_FUNC: ce
LOSS_REDUCTION: sum
OPT: Adam

# ★ Stronger weight decay
OPT_PARAMS: {betas: '(0.9, 0.98)', eps: '1e-9', weight_decay: '0.001'}

COUNT_LOSS_WEIGHT: 0.5

# ★ No label smoothing
LABEL_SMOOTHING: 0.0

CROSS_MODAL_LAYERS: 2
USE_YOLO_DETECTION: False
FUSE_RADAR_DATA: False
USE_QTYPE_WEIGHTS: True
USE_CLIP_FEATURES: True
USE_SPATIAL_PE: False
REFINEMENT_ITERATIONS: 0
