# ---------------------------------------------------------------
# Trimodal V29: BERT-base + V2 Features (COCO) + Seed 5555
#
# Diversity source:
#   1. Uses V2 (COCO) features, NOT V3 (YOLOWorld)
#   2. Different seed (5555) from V14-V18
#   3. Multi-head classification
#   4. BERT-base with 4 layers fine-tuned
#
# Why? V14-V18 all use V2 features but with the DEFAULT seed.
# A different seed on the same V2 features will get different
# samples right, boosting oracle ceiling on the V2 feature side.
# This adds diversity orthogonal to the V3-based models.
# ---------------------------------------------------------------

MODEL_USE: mcan
VISUAL_FEATURE: trimodal_fusion

OBJ_FEAT_SIZE: [80, 75]
BBOX_FEAT_SIZE: [100, 59]
LIDAR_FEAT_SIZE: [80, 6]
CAMERA_BEV_DIM: 69

LAYER: 6
HIDDEN_SIZE: 512
BBOXFEAT_EMB_SIZE: 512
FF_SIZE: 2048
MULTI_HEAD: 8
DROPOUT_R: 0.1
FLAT_MLP_SIZE: 512
FLAT_GLIMPSES: 1
FLAT_OUT_SIZE: 1024
USE_BBOX_FEAT: False
BBOX_NORMALIZE: False
WORD_EMBED_SIZE: 300

USE_BERT: True
USE_DISTILBERT: False
BERT_FINETUNE_LAYERS: 4

USE_MAP_FEATURES: True
MAP_DIM: 11
ENRICH_FEATURES: False

# ★ Uses V2 (COCO YOLO) features — NOT V3
USE_RADARXF_V3: False

USE_MULTI_HEAD: True

BATCH_SIZE: 32
LR_BASE: 0.00003
LR_DECAY_R: 0.2
LR_DECAY_LIST: [10, 12]
WARMUP_EPOCH: 3
MAX_EPOCH: 16
GRAD_NORM_CLIP: 1.0
GRAD_ACCU_STEPS: 4
LOSS_FUNC: ce
LOSS_REDUCTION: sum
OPT: Adam
OPT_PARAMS: {betas: '(0.9, 0.98)', eps: '1e-9', weight_decay: '0.0001'}

COUNT_LOSS_WEIGHT: 0.5
LABEL_SMOOTHING: 0.1
CROSS_MODAL_LAYERS: 2
USE_YOLO_DETECTION: False
FUSE_RADAR_DATA: False
USE_QTYPE_WEIGHTS: True
USE_CLIP_FEATURES: True
USE_SPATIAL_PE: False
REFINEMENT_ITERATIONS: 0
